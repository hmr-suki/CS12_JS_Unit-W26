<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>T8A - Colour Picker</title>
  </head>

  <body>
    <!-- Text -->
    <p> Enter Your color name</p>
    <!-- Input Box -->
    <input type="text" class="color" name="color">
    <!-- Button -->
    <button class="btn" onclick="backGround()">Change</button>

    <script>
      //function goes here
      function backGround(){
        let color = document.querySelector('.color').value;
        document.body.style.backgroundColor = color;

      }
    </script>
  </body>
</html>
