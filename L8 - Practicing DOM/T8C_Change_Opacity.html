<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>T8C - Change Opacity</title>

    <style>
      .box {
        background-color: blue;
        height: 100px;
        width: 250px;
      }
    </style>
  </head>
  <body>
    <h1>DOM TASK - Change Opacity</h1>

    <div class="box"></div>
    <br />
    <!-- add button for lighter -->
    <button class="btn2" onclick="Lighter()">Lighter</button>
    <!-- add button for darker -->
    <button class="btn1" onclick="Barker()">Darker</button>

    <script>
      // ELEMENTS
      let box_obj = document.querySelector(".box");
      box_obj.style.opacity = 0.5; //set box to starting opacity

      //VARIABLES
      //opacity variable
      let opacity = 1;
      //FUNCTIONS
      //light function decreases opacity
      function lighter() {
        opacity -=0.1;
        document.querySelector('.box').style.opacity = opacity
      }

      //dark function increases opacity
      function darker() {
        opacity+=0.1;
        document.querySelector('.box').style.opacity = opacity
      }

      //EVENT LISTENERS
      //add a click event to light button that calls the light function
      //add a click event to dark button that calls the dark function
    </script>
  </body>
</html>
