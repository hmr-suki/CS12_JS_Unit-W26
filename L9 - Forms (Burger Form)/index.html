<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<div class = heading>
  <h1> Johnny LaRue's Burger Drive-Thru</h1>
  <p>A Big Man Ltd. Subsiduary</p>

</div>

<body>
  <div class= "wrapper"> 
    <img src = 'burgers.gif' class = "img">

    <form class = "orderform" name = "orderform">
    
      <div class = "field">   Name: <input type="text" class="name" name="" value=""> </div>
      <div class = "field">   # of Burgers: <input type="number" class="burgerNumber" name="" value=""> </div>
      <div class = "field">   # of Fries: <input type="number" class="friesNumber" name="" value=""> </div>
      <div class = "field">   # of Drinks: <input type="number" class="drinksNumber" name="" value=""> </div>
      <div class = "field">   Subtotal: <input type="text" class="subtotal" name="" value="" readonly> </div>
      <div class = "field">   Tax: <input type="text" class="tax" name="" value="" readonly> </div>
      <div class = "field">   Total: <input type="text" class="total" name="" value="" readonly> </div>

      <div class = "field">   <button class="button" type = "button">Order Total </button> </div>
      <div class = "field">   <button class="button" type = "reset">Reset </button> </div>

    </form>


  
</div>
<script src="script.js"></script>
</body>

</html>
