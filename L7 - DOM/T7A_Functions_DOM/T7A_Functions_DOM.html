<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Functions and DOM</title>

    <script>
      function myFunction() {

        let p1 = document.querySelector(".para1");

        p1.textContent='Hi 114514';

        let p2 = document.querySelector(".para2");

        p2.innerHTML += '<br><img src="image.png">';


        

      }
    </script>
  </head>
  <body>
    <h1>Sample Web Page - Functions and DOM</h1>
    <br />
    <button
      type="button"
      name="button"
      onclick="myFunction()"
    >       Click Me!
    </button>

    <p class="para1">This is para1</p>
    <p class="para2">This is para2</p>
  </body>
</html>
