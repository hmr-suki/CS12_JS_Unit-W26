<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Checkbox Example 4</title>
    <script>
      function lights() {
             //need code here
          if (document.querySelector("#lightChkBox").checked == true) {
          document.body.style.backgroundColor = "black"
          // a block element fills the entire line and nothing can be displayed on it's right or left side.
        } else {
          document.body.style.backgroundColor = "white"
          // element will not be displayed on the screen
        }
       }      
    </script>
  </head>
  <body>
    <form>
      Light Switch: <input type="checkbox" id="lightChkBox" onClick="lights()" name="" value="">
    </form>

  </body>
</html>
